name: Smoke Tests (Emulator)

# Runs the instrumented smoke suite (all 48 game screens + real app launch)
# on an Android emulator. Triggered manually, or automatically when this
# workflow file itself changes (workflow_dispatch only works from the default
# branch, so the paths trigger is how we run it from the feature branch).
# To re-run from the feature branch: edit this comment's run counter. Run: 2
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/smoke-tests.yml'

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - name: Enable KVM for hardware-accelerated emulation
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run instrumented smoke tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          arch: x86_64
          disable-animations: true
          emulator-options: -no-snapshot -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          script: ./gradlew connectedDebugAndroidTest

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-test-reports
          path: app/build/reports/androidTests/connected/
          if-no-files-found: warn

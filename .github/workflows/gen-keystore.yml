name: Generate Signing Keystore

# One-off helper: creates a fixed-credential keystore and uploads it as an
# artifact so it can be committed to the repo. Every build then shares one
# signature, so app updates install cleanly over each other.
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/gen-keystore.yml'

jobs:
  keygen:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Generate keystore
        run: |
          keytool -genkeypair -v \
            -keystore pocketarcade.keystore \
            -alias pocketarcade \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass pocketarcade -keypass pocketarcade \
            -dname "CN=Pocket Arcade Offline, OU=Games, O=sclan, L=NA, S=NA, C=US"

      - name: Upload keystore
        uses: actions/upload-artifact@v4
        with:
          name: keystore
          path: pocketarcade.keystore
          if-no-files-found: error
